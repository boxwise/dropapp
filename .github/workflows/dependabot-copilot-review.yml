name: Dependabot Copilot review

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: dependabot-copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # pull_request_target uses base-branch code. Never check out or execute PR
      # code here: this job only lists/posts comments through the GitHub API.
      # GITHUB_TOKEN comments may not trigger Copilot. If needed, store a PAT
      # for a Copilot-enabled user with repository write access as the Dependabot
      # secret COPILOT_TRIGGER_TOKEN (regular Actions secrets are unavailable to
      # Dependabot-triggered runs). Scope it to this repository's issues/PRs.
      # Without that secret, fall back to GITHUB_TOKEN; manual invocation may be
      # required. A Dependabot-authored base ref can also restrict token access.
      - name: Request dependency impact review once
        uses: actions/github-script@v7.0.1
        with:
          github-token: ${{ secrets.COPILOT_TRIGGER_TOKEN || github.token }}
          script: |
            const marker = '<!-- dependabot-copilot-review -->';
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            };
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...issue, per_page: 100 }
            );
            if (comments.some(comment => (comment.body || '').includes(marker))) {
              core.info('Copilot dependency review was already requested.');
              return;
            }
            await github.rest.issues.createComment({
              ...issue,
              body: [
                marker,
                '@copilot use the review-dependabot-update skill on this PR.',
                'Read full release notes/changelogs for every updated package, assess Dropapp usages and runtime compatibility, and propose minimal required changes.',
                'Post the skill’s summary table, per-package findings, changes/diffs, validation results and merge recommendation.',
                'Never edit .circleci/config.yml or trigger deployments.'
              ].join('\n\n')
            });
