name: Request Copilot Dependabot review

on:
  pull_request_target:
    types: [opened, reopened]

# Privileged base-branch context: never check out or execute PR code here.
# Dependabot pull_request workflows have a read-only token and no Actions secrets.
# This workflow only lists and posts comments through the GitHub API.
permissions:
  pull-requests: write
  issues: write

concurrency:
  group: dependabot-copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Request review once
        uses: actions/github-script@v7
        with:
          # GITHUB_TOKEN comments may not trigger Copilot. If needed, configure a
          # least-privilege PAT as COPILOT_TRIGGER_TOKEN, never inline credentials.
          # Dependabot-triggered runs may need it as a Dependabot secret as well
          # as an Actions secret. See README for restrictions and manual fallback.
          github-token: ${{ secrets.COPILOT_TRIGGER_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- dependabot-copilot-review -->';
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue,
              per_page: 100,
            });
            if (comments.some(comment => comment.body?.includes(marker))) {
              core.info('Copilot review request already posted.');
              return;
            }
            await github.rest.issues.createComment({
              ...issue,
              body: `${marker}\n@copilot use the review-dependabot-update skill on this PR. Review every updated dependency against full release notes/changelogs and Dropapp usages, propose minimal required fixes, and report findings and validation in the skill's five-part format. Never edit .circleci/config.yml or trigger deployments.`,
            });
